name: Publish APT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out archive
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify archive signature
        env:
          GNUPGHOME: ${{ runner.temp }}/archive-gnupg
        run: |
          mkdir -m 700 -p "$GNUPGHOME"
          gpg --batch --import archive-key.asc
          gpg --batch --export D4FE96494637320FCA25DD35E94D1A6D97CE2319 > "$RUNNER_TEMP/archive-key.gpg"
          test -s "$RUNNER_TEMP/archive-key.gpg"
          gpgv --keyring "$RUNNER_TEMP/archive-key.gpg" dists/noble/InRelease
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
      - name: Upload archive
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
